<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CameLcase Hangman — Night0WL Feathers | Twisted23</title>
  <link rel="icon" type="image/png" href="../icon.png" />
  <style>
    :root {
      --bg: #070d18;
      --card-bg: #0f1c32;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-gold: rgba(245, 158, 11, 0.35);
      --cyan: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 3rem;
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(245, 158, 11, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.05) 0%, transparent 50%);
    }
    header {
      width: 100%;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    header a.brand { color: var(--accent); text-decoration: none; font-weight: 900; font-size: 1.15rem; letter-spacing: 0.05em; }
    .nav-links { display: flex; gap: 1rem; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.92rem; font-weight: 600; transition: color 0.15s; }
    .nav-links a:hover { color: #fff; }
    .btn-home {
      background: #1e293b;
      color: var(--cyan) !important;
      padding: 0.4rem 0.95rem;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .btn-home:hover { background: #334155; border-color: var(--cyan); }

    main { max-width: 860px; width: 100%; padding: 0 1rem; text-align: center; }
    h1 { font-size: 2.2rem; color: #fff; margin-bottom: 0.35rem; font-weight: 900; }
    .sub { color: var(--accent); font-size: 1.05rem; margin-bottom: 1.5rem; font-weight: 600; }

    .game-box {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.65), 0 0 30px rgba(245, 158, 11, 0.08);
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .mode-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 0.5rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn:hover { border-color: var(--accent); color: #fff; }
    .mode-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.45);
    }

    /* OWL STAGE & SVG GRAPHIC */
    .owl-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0.5rem 0 1.5rem;
      position: relative;
    }
    .night0wl-svg {
      max-width: 240px;
      height: auto;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }
    .feather-counter-tag {
      margin-top: 0.5rem;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--accent);
      background: rgba(15, 23, 42, 0.8);
      padding: 0.3rem 0.9rem;
      border-radius: 9999px;
      border: 1px solid var(--border-gold);
    }

    /* Feather Animations */
    .owl-feather {
      transition: opacity 0.5s ease, transform 0.6s ease;
      transform-origin: center;
    }
    .owl-feather.shedding-left {
      animation: featherShedLeft 0.8s forwards ease-in;
    }
    .owl-feather.shedding-right {
      animation: featherShedRight 0.8s forwards ease-in;
    }
    .owl-feather.shed {
      opacity: 0 !important;
      visibility: hidden;
    }
    @keyframes featherShedLeft {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      40% { transform: translate(-20px, 20px) rotate(-30deg); opacity: 0.8; }
      100% { transform: translate(-45px, 80px) rotate(-70deg); opacity: 0; }
    }
    @keyframes featherShedRight {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      40% { transform: translate(20px, 20px) rotate(30deg); opacity: 0.8; }
      100% { transform: translate(45px, 80px) rotate(70deg); opacity: 0; }
    }

    /* WORD SLOTS */
    .word-slots {
      display: flex;
      gap: 0.65rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      min-height: 64px;
    }
    .slot-box {
      width: 48px;
      height: 60px;
      border-bottom: 3.5px solid var(--accent);
      background: rgba(255,255,255,0.04);
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.85rem;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: var(--cyan);
      box-shadow: inset 0 -4px 10px rgba(245, 158, 11, 0.1);
      transition: all 0.2s;
    }
    .slot-box.revealed-lost {
      color: #f87171 !important;
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    /* KEYBOARD */
    .keyboard-container {
      max-width: 680px;
      margin: 0 auto 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      align-items: center;
    }
    .keyboard-row {
      display: flex;
      gap: 0.35rem;
      justify-content: center;
      width: 100%;
      flex-wrap: wrap;
    }
    .key-btn {
      min-width: 36px;
      height: 44px;
      padding: 0 0.5rem;
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      border-radius: 6px;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.15s;
      font-family: ui-monospace, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .key-btn:hover { background: var(--cyan); color: #000; border-color: var(--cyan); }
    .key-btn.hit { background: #065f46; color: #6ee7b7; border-color: #10b981; pointer-events: none; }
    .key-btn.miss { background: #1e1e24; color: #64748b; border-color: #334155; opacity: 0.4; pointer-events: none; text-decoration: line-through; }

    /* STATS */
    .stats-row {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid var(--border);
      padding-top: 1.25rem;
      font-family: ui-monospace, monospace;
      font-size: 0.92rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .stats-row span { color: #fff; font-weight: 800; }

    /* MODAL OVERLAY (WIN/LOSS) */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 13, 24, 0.92);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 1rem;
    }
    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #0f1c32;
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 2.2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 30px var(--accent-glow);
    }
    .modal-card h2 { font-size: 1.85rem; margin-bottom: 0.5rem; }
    .modal-card.win h2 { color: #10b981; }
    .modal-card.loss h2 { color: #ef4444; }
    .modal-card p { color: var(--text-muted); font-size: 1rem; margin-bottom: 1.5rem; line-height: 1.5; }
    .btn-restart {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.75rem 1.8rem;
      border-radius: 9999px;
      font-weight: 900;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      transition: transform 0.15s, background 0.15s;
    }
    .btn-restart:hover { transform: scale(1.05); background: #fbbf24; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">TWISTED23</a>
    <div class="nav-links">
      <a href="/" class="btn-home">🏠 Home</a>
      <a href="/backgammon/">🎲 Backgammon</a>
      <a href="/slider/">🌀 Slider Table</a>
      <a href="/flippingdice/">🎲 Flipping Dice</a>
    </div>
  </header>

  <main>
    <h1>CameLcase Hangman</h1>
    <div class="sub">Night0WL Plumage &amp; Shannon Letter Entropy</div>

    <div class="game-box">
      <!-- Result Modal Overlay -->
      <div class="modal-overlay" id="resultModal">
        <div class="modal-card" id="modalCard">
          <h2 id="modalTitle">Victory!</h2>
          <p id="modalDesc">You solved the CameLcase word with feathers to spare!</p>
          <button class="btn-restart" id="btnPlayAgain">Play Another Word 🔄</button>
        </div>
      </div>

      <!-- Mode Selector -->
      <div class="mode-bar">
        <button class="mode-btn active" id="btnModeClassic">🦉 Classic CameLcase</button>
        <button class="mode-btn" id="btnModeAdvance">⚡ Advance Mode (Entropy)</button>
        <button class="mode-btn" id="btnModeLeet">🔢 Leet / 1557 Digit Mode</button>
      </div>

      <!-- Night0WL Feather Stage -->
      <div class="owl-stage">
        <svg class="night0wl-svg" viewBox="0 0 240 220" width="230" height="200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="owlBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1e293b"/>
              <stop offset="100%" stop-color="#0f172a"/>
            </linearGradient>
            <linearGradient id="goldFeather" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fbbf24"/>
              <stop offset="100%" stop-color="#d97706"/>
            </linearGradient>
            <linearGradient id="cyanFeather" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </linearGradient>
            <radialGradient id="eyeGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="55%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#b45309"/>
            </radialGradient>
            <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3.5" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Perch Branch -->
          <path d="M 15 194 Q 120 182 225 194 Q 120 206 15 194 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
          <!-- Perch Talons -->
          <ellipse cx="94" cy="192" rx="9" ry="4.5" fill="#f59e0b"/>
          <ellipse cx="146" cy="192" rx="9" ry="4.5" fill="#f59e0b"/>

          <!-- Tail -->
          <polygon points="106,170 120,202 134,170" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

          <!-- Main Body -->
          <ellipse cx="120" cy="134" rx="52" ry="58" fill="url(#owlBodyGrad)" stroke="#38bdf8" stroke-width="1.5"/>

          <!-- Chest Plumage Rings -->
          <path d="M 98 128 Q 120 144 142 128" stroke="#475569" stroke-width="2" fill="none"/>
          <path d="M 104 144 Q 120 158 136 144" stroke="#475569" stroke-width="2" fill="none"/>
          <path d="M 110 160 Q 120 170 130 160" stroke="#475569" stroke-width="2" fill="none"/>

          <!-- Owl Head -->
          <ellipse cx="120" cy="72" rx="46" ry="40" fill="url(#owlBodyGrad)" stroke="#38bdf8" stroke-width="1.5"/>

          <!-- Owl Horns / Ear Tufts -->
          <polygon points="82,45 74,15 102,36" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
          <polygon points="158,45 166,15 138,36" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

          <!-- Eye Discs -->
          <circle cx="101" cy="72" r="21" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
          <circle cx="139" cy="72" r="21" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

          <!-- Big Glowing Owl Eyes -->
          <circle id="owlEyeLeft" cx="101" cy="72" r="14.5" fill="url(#eyeGrad)" filter="url(#goldGlow)"/>
          <circle id="owlEyeRight" cx="139" cy="72" r="14.5" fill="url(#eyeGrad)" filter="url(#goldGlow)"/>

          <!-- Pupils -->
          <circle id="pupilLeft" cx="101" cy="72" r="6.5" fill="#000"/>
          <circle id="pupilRight" cx="139" cy="72" r="6.5" fill="#000"/>

          <!-- Eye Sparkle -->
          <circle id="sparkleLeft" cx="98" cy="69" r="2.2" fill="#fff"/>
          <circle id="sparkleRight" cx="136" cy="69" r="2.2" fill="#fff"/>

          <!-- Amber Beak -->
          <polygon points="116,77 124,77 120,91" fill="#f59e0b"/>

          <!-- 6 VIBRANT NIGHT0WL FEATHERS (3 LEFT, 3 RIGHT) -->
          <!-- Feather 1: Left Crest Feather -->
          <g id="feather_1" class="owl-feather">
            <path d="M 74 20 Q 56 36 68 56 Q 82 40 74 20 Z" fill="url(#goldFeather)" filter="url(#goldGlow)"/>
            <line x1="72" y1="24" x2="72" y2="50" stroke="#fff" stroke-width="1" opacity="0.6"/>
          </g>

          <!-- Feather 2: Left Upper Wing -->
          <g id="feather_2" class="owl-feather">
            <path d="M 68 95 Q 38 115 50 145 Q 75 130 68 95 Z" fill="url(#cyanFeather)" filter="url(#goldGlow)"/>
            <line x1="64" y1="102" x2="56" y2="135" stroke="#fff" stroke-width="1" opacity="0.6"/>
          </g>

          <!-- Feather 3: Left Lower Wing -->
          <g id="feather_3" class="owl-feather">
            <path d="M 64 135 Q 38 160 54 182 Q 76 165 64 135 Z" fill="url(#goldFeather)" filter="url(#goldGlow)"/>
            <line x1="62" y1="142" x2="55" y2="172" stroke="#fff" stroke-width="1" opacity="0.6"/>
          </g>

          <!-- Feather 4: Right Crest Feather -->
          <g id="feather_4" class="owl-feather">
            <path d="M 166 20 Q 184 36 172 56 Q 158 40 166 20 Z" fill="url(#goldFeather)" filter="url(#goldGlow)"/>
            <line x1="168" y1="24" x2="168" y2="50" stroke="#fff" stroke-width="1" opacity="0.6"/>
          </g>

          <!-- Feather 5: Right Upper Wing -->
          <g id="feather_5" class="owl-feather">
            <path d="M 172 95 Q 202 115 190 145 Q 165 130 172 95 Z" fill="url(#cyanFeather)" filter="url(#goldGlow)"/>
            <line x1="176" y1="102" x2="184" y2="135" stroke="#fff" stroke-width="1" opacity="0.6"/>
          </g>

          <!-- Feather 6: Right Lower Wing -->
          <g id="feather_6" class="owl-feather">
            <path d="M 176 135 Q 202 160 186 182 Q 164 165 176 135 Z" fill="url(#goldFeather)" filter="url(#goldGlow)"/>
            <line x1="178" y1="142" x2="185" y2="172" stroke="#fff" stroke-width="1" opacity="0.6"/>
          </g>
        </svg>

        <div class="feather-counter-tag" id="featherCounter">🪶 6 Feathers Remaining (0 Strikes)</div>
      </div>

      <!-- Word Display Slots -->
      <div class="word-slots" id="wordSlots"></div>

      <!-- Interactive Keyboard with Digit & Letter rows -->
      <div class="keyboard-container" id="keyboard"></div>

      <!-- Shannon Entropy & Game Stats -->
      <div class="stats-row">
        <div>STRIKES: <span id="statStrikes">0 / 6</span></div>
        <div>SHANNON ENTROPY: <span id="statEntropy">4.18 bits</span></div>
        <div>TARGET SEED: <span id="statLeet">Night0WL</span></div>
      </div>
    </div>
  </main>

  <script>
    const WORDS_CLASSIC = ['Night0WL', 'CameLcase', 'TopHat24', 'Twisted23', 'Gravity'];
    const WORDS_ADVANCE = ['Entropy', 'Shannon', 'Parity', 'Night0WL', 'Switchboard', 'Quantum'];
    const WORDS_LEET = [
      { code: '1557', word: 'LEET', desc: 'Shape1st Glide (L=1, E=5, E=5, T=7)' },
      { code: '13112', word: 'MILK', desc: 'Milk (#13112) before Meat (#13517)' },
      { code: '13517', word: 'MEAT', desc: 'Meat (#13517) exception rule' },
      { code: '38557', word: 'CRYST', desc: 'MLeet: C=3, R=8, Y=5, S=5, T=7' },
      { code: '5721', word: 'STARTUP', desc: 'MLeet: S=5, T=7, U=21' },
      { code: '5132', word: 'SICK', desc: 'MLeet: S=5, I=1, C=3, K=2' },
      { code: '13557', word: 'MLEET', desc: 'MLeet: 13 encapsulates M & L' },
      { code: '140831', word: 'NORMA', desc: "Where's Norma (#140831)" },
      { code: '231140', word: 'WALDO', desc: "WaLdo (#231140)" }
    ];

    let mode = 'classic';
    let target = 'Night0WL';
    let currentLeetObj = WORDS_LEET[0];
    let guessed = new Set();
    let strikes = 0;
    let isGameOver = false;

    function calcShannonEntropy(str) {
      const counts = {};
      const len = str.length;
      for (let ch of str) {
        counts[ch] = (counts[ch] || 0) + 1;
      }
      let h = 0;
      for (let ch in counts) {
        let p = counts[ch] / len;
        h -= p * Math.log2(p);
      }
      return h.toFixed(2);
    }

    function initGame() {
      guessed.clear();
      strikes = 0;
      isGameOver = false;

      // Reset modal
      document.getElementById('resultModal').classList.remove('show');

      // Reset Night0WL feathers and eyes
      for (let i = 1; i <= 6; i++) {
        const f = document.getElementById(`feather_${i}`);
        if (f) {
          f.className = 'owl-feather';
          f.style.opacity = '1';
          f.style.visibility = 'visible';
        }
      }
      document.getElementById('owlEyeLeft').setAttribute('r', '14.5');
      document.getElementById('owlEyeRight').setAttribute('r', '14.5');
      document.getElementById('pupilLeft').setAttribute('r', '6.5');
      document.getElementById('pupilRight').setAttribute('r', '6.5');

      if (mode === 'leet') {
        currentLeetObj = WORDS_LEET[Math.floor(Math.random() * WORDS_LEET.length)];
        target = currentLeetObj.code;
      } else if (mode === 'advance') {
        target = WORDS_ADVANCE[Math.floor(Math.random() * WORDS_ADVANCE.length)];
      } else {
        target = WORDS_CLASSIC[Math.floor(Math.random() * WORDS_CLASSIC.length)];
      }

      renderSlots();
      renderKeyboard();
      updateStats();
    }

    function renderSlots(revealedLost = false) {
      const container = document.getElementById('wordSlots');
      container.innerHTML = '';
      for (let ch of target) {
        const slot = document.createElement('div');
        slot.className = 'slot-box';
        const isGuessed = guessed.has(ch.toUpperCase());
        if (isGuessed) {
          slot.textContent = ch;
        } else if (revealedLost) {
          slot.textContent = ch;
          slot.classList.add('revealed-lost');
        } else {
          slot.textContent = '';
        }
        container.appendChild(slot);
      }
    }

    function renderKeyboard() {
      const container = document.getElementById('keyboard');
      container.innerHTML = '';

      if (mode === 'leet') {
        const row = document.createElement('div');
        row.className = 'keyboard-row';
        for (let digit of '0123456789'.split('')) {
          row.appendChild(createKeyButton(digit));
        }
        container.appendChild(row);
      } else {
        // Rows: Digits (for Night0WL, TopHat24, Twisted23) + QWERTY
        const rows = [
          '0123456789'.split(''),
          'QWERTYUIOP'.split(''),
          'ASDFGHJKL'.split(''),
          'ZXCVBNM'.split('')
        ];

        rows.forEach(r => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'keyboard-row';
          r.forEach(ch => {
            rowDiv.appendChild(createKeyButton(ch));
          });
          container.appendChild(rowDiv);
        });
      }
    }

    function createKeyButton(ch) {
      const btn = document.createElement('button');
      btn.className = 'key-btn';
      btn.textContent = ch;

      if (guessed.has(ch)) {
        const hit = target.toUpperCase().includes(ch);
        btn.classList.add(hit ? 'hit' : 'miss');
      }

      btn.onclick = () => handleGuess(ch);
      return btn;
    }

    function shedFeather(strikeNum) {
      const featherEl = document.getElementById(`feather_${strikeNum}`);
      if (!featherEl) return;
      const isLeft = strikeNum <= 3;
      featherEl.classList.add(isLeft ? 'shedding-left' : 'shedding-right');
      setTimeout(() => {
        featherEl.classList.add('shed');
      }, 750);
    }

    function handleGuess(ch) {
      if (isGameOver || guessed.has(ch)) return;
      guessed.add(ch);

      const isHit = target.toUpperCase().includes(ch);
      if (!isHit) {
        strikes++;
        shedFeather(strikes);
      }

      renderSlots();
      renderKeyboard();
      updateStats();

      // Check Win Condition
      const allRevealed = target.split('').every(c => guessed.has(c.toUpperCase()));
      if (allRevealed) {
        handleWin();
        return;
      }

      // Check Loss Condition
      if (strikes >= 6) {
        handleLoss();
      }
    }

    function handleWin() {
      isGameOver = true;
      const card = document.getElementById('modalCard');
      card.className = 'modal-card win';
      document.getElementById('modalTitle').textContent = '🦉 Feather Master!';
      document.getElementById('modalDesc').textContent = `Magnificent! You solved "${target}" with ${6 - strikes} feathers intact! Shannon entropy preserved.`;
      setTimeout(() => {
        document.getElementById('resultModal').classList.add('show');
      }, 500);
    }

    function handleLoss() {
      isGameOver = true;
      // Droop / close owl eyes
      document.getElementById('owlEyeLeft').setAttribute('r', '3');
      document.getElementById('owlEyeRight').setAttribute('r', '3');
      document.getElementById('pupilLeft').setAttribute('r', '0');
      document.getElementById('pupilRight').setAttribute('r', '0');

      renderSlots(true); // reveal all slots with red styling

      const card = document.getElementById('modalCard');
      card.className = 'modal-card loss';
      document.getElementById('modalTitle').textContent = '🪶 All Feathers Shed!';
      document.getElementById('modalDesc').textContent = `Night0WL succumbed to entropy! The hidden target was "${target}". Try another round!`;
      setTimeout(() => {
        document.getElementById('resultModal').classList.add('show');
      }, 700);
    }

    function updateStats() {
      const remainingFeathers = Math.max(0, 6 - strikes);
      document.getElementById('statStrikes').textContent = `${strikes} / 6`;
      document.getElementById('featherCounter').textContent = `🪶 ${remainingFeathers} Feather${remainingFeathers === 1 ? '' : 's'} Remaining (${strikes} Strike${strikes === 1 ? '' : 's'})`;

      const entropy = calcShannonEntropy(target);
      document.getElementById('statEntropy').textContent = `${entropy} bits`;

      document.getElementById('statLeet').textContent = mode === 'leet' 
        ? `${currentLeetObj.word} (#${target})` 
        : target;
    }

    // Physical Keyboard Listener
    window.addEventListener('keydown', (e) => {
      if (isGameOver) return;
      const key = e.key.toUpperCase();
      if (/^[A-Z0-9]$/.test(key)) {
        handleGuess(key);
      }
    });

    // Play Again Button
    document.getElementById('btnPlayAgain').onclick = () => {
      initGame();
    };

    // Mode Buttons
    document.getElementById('btnModeClassic').onclick = () => {
      mode = 'classic';
      setActiveBtn('btnModeClassic');
      initGame();
    };
    document.getElementById('btnModeAdvance').onclick = () => {
      mode = 'advance';
      setActiveBtn('btnModeAdvance');
      initGame();
    };
    document.getElementById('btnModeLeet').onclick = () => {
      mode = 'leet';
      setActiveBtn('btnModeLeet');
      initGame();
    };

    function setActiveBtn(id) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // Initialize Game on Load
    initGame();
  </script>
